<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bulk Tracker</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#292524" />
<link rel="icon" href="icon-192.png" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; background: #fafaf9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const DEFAULT_TARGETS = { cal: 2400, protein: 95, carbs: 325, fat: 72 };

const fmtDate = (d) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

const todayStr = () => fmtDate(new Date());
const keyFor = (dateStr) => `log:${dateStr}`;

// ---- localStorage-backed storage shim (replaces window.storage) ----
const storage = {
  async get(key) {
    const raw = window.localStorage.getItem(key);
    if (raw === null) return null;
    return { key, value: raw };
  },
  async set(key, value) {
    window.localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    window.localStorage.removeItem(key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const keys = [];
    for (let i = 0; i < window.localStorage.length; i++) {
      const k = window.localStorage.key(i);
      if (!prefix || k.startsWith(prefix)) keys.push(k);
    }
    return { keys, prefix };
  },
};

function Icon({ path, size = 16 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      {path}
    </svg>
  );
}

const IconPlus = (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />;
const IconTrash = (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></>} />;
const IconFlame = (p) => <Icon {...p} path={<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>} />;
const IconBeef = (p) => <Icon {...p} path={<><circle cx="12.5" cy="8.5" r="6.5"/><path d="M8.5 8.5a4 4 0 1 0 4-4"/></>} />;
const IconWheat = (p) => <Icon {...p} path={<><path d="M2 22 16 8"/><path d="M3.47 12.53 5 11l1.53 1.53a3.5 3.5 0 0 1 0 4.94L5 19l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z"/><path d="M7.47 8.53 9 7l1.53 1.53a3.5 3.5 0 0 1 0 4.94L9 15l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z"/><path d="M11.47 4.53 13 3l1.53 1.53a3.5 3.5 0 0 1 0 4.94L13 11l-1.53-1.53a3.5 3.5 0 0 1 0-4.94Z"/></>} />;
const IconDrop = (p) => <Icon {...p} path={<path d="M12 2.69s-7 7.44-7 11.31a7 7 0 0 0 14 0c0-3.87-7-11.31-7-11.31z"/>} />;
const IconScale = (p) => <Icon {...p} path={<><path d="M16 16H8"/><path d="M12 3v13"/><path d="m6 7 3-4 3 4"/><path d="m18 7-3-4-3 4"/><path d="M3 16a2 2 0 0 0 4 0"/><path d="M17 16a2 2 0 0 0 4 0"/></>} />;
const IconCalendar = (p) => <Icon {...p} path={<><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>} />;
const IconList = (p) => <Icon {...p} path={<><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></>} />;
const IconSettings = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>} />;

function WeightChart({ data }) {
  if (data.length < 2) return null;
  const width = 320;
  const height = 140;
  const padding = 28;
  const kgValues = data.map((d) => d.kg);
  const min = Math.min(...kgValues) - 0.5;
  const max = Math.max(...kgValues) + 0.5;
  const range = max - min || 1;

  const points = data.map((d, i) => {
    const x = padding + (i / (data.length - 1)) * (width - padding * 2);
    const y = height - padding - ((d.kg - min) / range) * (height - padding * 2);
    return { x, y, kg: d.kg, date: d.date };
  });

  const pathD = points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");

  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} className="overflow-visible">
      <path d={pathD} fill="none" stroke="#0891b2" strokeWidth="2" />
      {points.map((p, i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="3" fill="#0891b2" />
          <text x={p.x} y={height - 6} fontSize="9" fill="#a8a29e" textAnchor="middle">{p.date}</text>
        </g>
      ))}
      <text x={points[points.length - 1].x} y={points[points.length - 1].y - 10} fontSize="11" fill="#0891b2" textAnchor="middle" fontWeight="600">
        {points[points.length - 1].kg}kg
      </text>
    </svg>
  );
}

function NutritionTracker() {
  const [tab, setTab] = useState("today");

  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ name: "", cal: "", protein: "", carbs: "", fat: "" });
  const [showForm, setShowForm] = useState(false);
  const [selectedDate, setSelectedDate] = useState(todayStr());
  const [saveError, setSaveError] = useState("");
  const [isSaving, setIsSaving] = useState(false);
  const key = keyFor(selectedDate);

  const [history, setHistory] = useState([]);
  const [historyLoading, setHistoryLoading] = useState(false);

  const [weights, setWeights] = useState([]);
  const [weightLoading, setWeightLoading] = useState(true);
  const [weightInput, setWeightInput] = useState("");
  const [selectedWeightDate, setSelectedWeightDate] = useState(todayStr());

  const [targets, setTargets] = useState(DEFAULT_TARGETS);
  const [showSettings, setShowSettings] = useState(false);
  const [targetsForm, setTargetsForm] = useState(DEFAULT_TARGETS);

  useEffect(() => {
    setLoading(true);
    setEntries([]);
    (async () => {
      try {
        const res = await storage.get(key);
        if (res && res.value) setEntries(JSON.parse(res.value));
      } catch (e) {}
      setLoading(false);
    })();
  }, [selectedDate]);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("targets");
        if (res && res.value) {
          const t = JSON.parse(res.value);
          setTargets(t);
          setTargetsForm(t);
        }
      } catch (e) {}
    })();
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("weight-log");
        if (res && res.value) setWeights(JSON.parse(res.value));
      } catch (e) {}
      setWeightLoading(false);
    })();
  }, []);

  useEffect(() => {
    if (tab === "history") loadHistory();
  }, [tab]);

  const loadHistory = async () => {
    setHistoryLoading(true);
    try {
      const listRes = await storage.list("log:");
      const keys = listRes && listRes.keys ? listRes.keys : [];
      const days = [];
      for (const k of keys) {
        const res = await storage.get(k);
        if (res && res.value) {
          const dayEntries = JSON.parse(res.value);
          const totals = dayEntries.reduce(
            (acc, e) => ({
              cal: acc.cal + e.cal,
              protein: acc.protein + e.protein,
              carbs: acc.carbs + e.carbs,
              fat: acc.fat + e.fat,
            }),
            { cal: 0, protein: 0, carbs: 0, fat: 0 }
          );
          days.push({ date: k.replace("log:", ""), ...totals, count: dayEntries.length });
        }
      }
      days.sort((a, b) => (a.date < b.date ? 1 : -1));
      setHistory(days);
    } catch (e) {
      console.error(e);
    }
    setHistoryLoading(false);
  };

  const save = async (newEntries) => {
    const prevEntries = entries;
    setEntries(newEntries);
    setSaveError("");
    setIsSaving(true);
    try {
      const result = await storage.set(key, JSON.stringify(newEntries));
      if (!result) throw new Error("Storage write returned no result");
    } catch (e) {
      console.error("save failed", e);
      setEntries(prevEntries);
      setSaveError(`Save failed: ${e?.message || String(e)}`);
    }
    setIsSaving(false);
  };

  const addEntry = async () => {
    if (!form.name || !form.cal) return;
    const entry = {
      id: Date.now(),
      name: form.name,
      cal: Number(form.cal) || 0,
      protein: Number(form.protein) || 0,
      carbs: Number(form.carbs) || 0,
      fat: Number(form.fat) || 0,
    };
    await save([...entries, entry]);
    setForm({ name: "", cal: "", protein: "", carbs: "", fat: "" });
    setShowForm(false);
  };

  const removeEntry = (id) => save(entries.filter((e) => e.id !== id));

  const addWeight = async () => {
    const kg = Number(weightInput);
    if (!kg) return;
    const prevWeights = weights;
    const filtered = weights.filter((w) => w.date !== selectedWeightDate);
    const newWeights = [...filtered, { date: selectedWeightDate, kg }].sort((a, b) => (a.date > b.date ? 1 : -1));
    setWeights(newWeights);
    setWeightInput("");
    setSaveError("");
    try {
      const result = await storage.set("weight-log", JSON.stringify(newWeights));
      if (!result) throw new Error("Storage write returned no result");
    } catch (e) {
      console.error("weight save failed", e);
      setWeights(prevWeights);
      setSaveError(`Save failed: ${e?.message || String(e)}`);
    }
  };

  const removeWeight = async (date) => {
    const prevWeights = weights;
    const newWeights = weights.filter((w) => w.date !== date);
    setWeights(newWeights);
    setSaveError("");
    try {
      const result = await storage.set("weight-log", JSON.stringify(newWeights));
      if (!result) throw new Error("Storage write returned no result");
    } catch (e) {
      console.error(e);
      setWeights(prevWeights);
      setSaveError(`Delete failed: ${e?.message || String(e)}`);
    }
  };

  const saveTargets = async () => {
    const newTargets = {
      cal: Number(targetsForm.cal) || DEFAULT_TARGETS.cal,
      protein: Number(targetsForm.protein) || DEFAULT_TARGETS.protein,
      carbs: Number(targetsForm.carbs) || DEFAULT_TARGETS.carbs,
      fat: Number(targetsForm.fat) || DEFAULT_TARGETS.fat,
    };
    const prevTargets = targets;
    setTargets(newTargets);
    setSaveError("");
    try {
      const result = await storage.set("targets", JSON.stringify(newTargets));
      if (!result) throw new Error("Storage write returned no result");
      setShowSettings(false);
    } catch (e) {
      console.error("targets save failed", e);
      setTargets(prevTargets);
      setSaveError(`Save failed: ${e?.message || String(e)}`);
    }
  };

  const totals = entries.reduce(
    (acc, e) => ({
      cal: acc.cal + e.cal,
      protein: acc.protein + e.protein,
      carbs: acc.carbs + e.carbs,
      fat: acc.fat + e.fat,
    }),
    { cal: 0, protein: 0, carbs: 0, fat: 0 }
  );

  const Bar = ({ label, icon: IconComp, value, target, unit, color }) => {
    const pct = Math.min(100, (value / target) * 100);
    return (
      <div className="mb-3">
        <div className="flex items-center justify-between text-sm mb-1">
          <div className="flex items-center gap-1.5 text-stone-600">
            <IconComp size={14} />
            <span className="font-medium">{label}</span>
          </div>
          <span className="text-stone-500">{Math.round(value)}{unit} / {target}{unit}</span>
        </div>
        <div className="w-full h-2 bg-stone-200 rounded-full overflow-hidden">
          <div className="h-full rounded-full transition-all duration-500" style={{ width: `${pct}%`, backgroundColor: color }} />
        </div>
      </div>
    );
  };

  const TabButton = ({ id, label, icon: IconComp }) => (
    <button
      onClick={() => setTab(id)}
      className={`flex-1 flex items-center justify-center gap-1.5 py-2.5 text-sm font-medium rounded-xl transition-colors ${tab === id ? "bg-stone-800 text-white" : "text-stone-500"}`}
    >
      <IconComp size={15} />
      {label}
    </button>
  );

  return (
    <div className="min-h-screen bg-stone-50 p-5 font-sans">
      <div className="max-w-md mx-auto">
        <div className="flex items-center justify-between mb-1">
          <h1 className="text-xl font-bold text-stone-800">Bulk Tracker</h1>
          <button
            onClick={() => {
              setTargetsForm(targets);
              setShowSettings(!showSettings);
            }}
            className="text-stone-400 hover:text-stone-600 p-1.5"
          >
            <IconSettings size={20} />
          </button>
        </div>
        <p className="text-stone-500 text-sm mb-4">
          {new Date().toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" })}
        </p>

        {showSettings && (
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-200 mb-4 space-y-2">
            <p className="text-stone-800 text-sm font-medium mb-1">Daily Targets</p>
            <div className="grid grid-cols-2 gap-2">
              <label className="text-xs text-stone-500">
                Calories
                <input
                  className="w-full border border-stone-200 rounded-lg px-2 py-1.5 text-sm mt-1"
                  type="number"
                  value={targetsForm.cal}
                  onChange={(e) => setTargetsForm({ ...targetsForm, cal: e.target.value })}
                />
              </label>
              <label className="text-xs text-stone-500">
                Protein (g)
                <input
                  className="w-full border border-stone-200 rounded-lg px-2 py-1.5 text-sm mt-1"
                  type="number"
                  value={targetsForm.protein}
                  onChange={(e) => setTargetsForm({ ...targetsForm, protein: e.target.value })}
                />
              </label>
              <label className="text-xs text-stone-500">
                Carbs (g)
                <input
                  className="w-full border border-stone-200 rounded-lg px-2 py-1.5 text-sm mt-1"
                  type="number"
                  value={targetsForm.carbs}
                  onChange={(e) => setTargetsForm({ ...targetsForm, carbs: e.target.value })}
                />
              </label>
              <label className="text-xs text-stone-500">
                Fat (g)
                <input
                  className="w-full border border-stone-200 rounded-lg px-2 py-1.5 text-sm mt-1"
                  type="number"
                  value={targetsForm.fat}
                  onChange={(e) => setTargetsForm({ ...targetsForm, fat: e.target.value })}
                />
              </label>
            </div>
            <div className="flex gap-2 pt-1">
              <button onClick={saveTargets} className="flex-1 bg-stone-800 text-white rounded-lg py-2 text-sm font-medium">
                Save Targets
              </button>
              <button onClick={() => setShowSettings(false)} className="px-4 py-2 text-stone-500 text-sm">
                Cancel
              </button>
            </div>
          </div>
        )}

        <div className="flex gap-1 bg-white p-1 rounded-2xl border border-stone-200 mb-4">
          <TabButton id="today" label="Log" icon={IconList} />
          <TabButton id="history" label="History" icon={IconCalendar} />
          <TabButton id="weight" label="Weight" icon={IconScale} />
        </div>

        {saveError && (
          <div className="bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-2 mb-4">
            {saveError}
          </div>
        )}

        {tab === "today" && (
          <>
            <div className="flex items-center justify-between bg-white rounded-2xl px-4 py-3 shadow-sm border border-stone-200 mb-4">
              <button
                onClick={() => {
                  const d = new Date(selectedDate + "T00:00:00");
                  d.setDate(d.getDate() - 1);
                  setSelectedDate(fmtDate(d));
                }}
                className="text-stone-500 text-sm px-2 py-1"
              >← Prev</button>
              <input
                type="date"
                value={selectedDate}
                max={todayStr()}
                onChange={(e) => setSelectedDate(e.target.value)}
                className="text-sm font-medium text-stone-800 border-none bg-transparent text-center"
              />
              <button
                onClick={() => {
                  const d = new Date(selectedDate + "T00:00:00");
                  d.setDate(d.getDate() + 1);
                  const next = fmtDate(d);
                  if (next <= todayStr()) setSelectedDate(next);
                }}
                disabled={selectedDate >= todayStr()}
                className="text-stone-500 text-sm px-2 py-1 disabled:opacity-30"
              >Next →</button>
            </div>

            {loading ? (
              <p className="text-stone-400 text-sm text-center py-6">Loading...</p>
            ) : (
              <>
                <div className="bg-white rounded-2xl p-5 shadow-sm border border-stone-200 mb-4">
                  <Bar label="Calories" icon={IconFlame} value={totals.cal} target={targets.cal} unit="" color="#ea580c" />
                  <Bar label="Protein" icon={IconBeef} value={totals.protein} target={targets.protein} unit="g" color="#dc2626" />
                  <Bar label="Carbs" icon={IconWheat} value={totals.carbs} target={targets.carbs} unit="g" color="#ca8a04" />
                  <Bar label="Fat" icon={IconDrop} value={totals.fat} target={targets.fat} unit="g" color="#0891b2" />
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-stone-200 mb-4 overflow-hidden">
                  {entries.length === 0 ? (
                    <p className="text-stone-400 text-sm text-center py-6">No entries yet</p>
                  ) : (
                    entries.map((e) => (
                      <div key={e.id} className="flex items-center justify-between px-4 py-3 border-b border-stone-100 last:border-0">
                        <div>
                          <p className="text-stone-800 text-sm font-medium">{e.name}</p>
                          <p className="text-stone-400 text-xs">{e.cal} cal · {e.protein}g P · {e.carbs}g C · {e.fat}g F</p>
                        </div>
                        <button onClick={() => removeEntry(e.id)} className="text-stone-300 hover:text-red-500 p-1">
                          <IconTrash size={16} />
                        </button>
                      </div>
                    ))
                  )}
                </div>

                {showForm ? (
                  <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-200 space-y-2">
                    <input
                      className="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm"
                      placeholder="Meal / item name"
                      value={form.name}
                      onChange={(e) => setForm({ ...form, name: e.target.value })}
                    />
                    <div className="grid grid-cols-4 gap-2">
                      <input className="border border-stone-200 rounded-lg px-2 py-2 text-sm" placeholder="Cal" type="number" value={form.cal} onChange={(e) => setForm({ ...form, cal: e.target.value })} />
                      <input className="border border-stone-200 rounded-lg px-2 py-2 text-sm" placeholder="Prot" type="number" value={form.protein} onChange={(e) => setForm({ ...form, protein: e.target.value })} />
                      <input className="border border-stone-200 rounded-lg px-2 py-2 text-sm" placeholder="Carb" type="number" value={form.carbs} onChange={(e) => setForm({ ...form, carbs: e.target.value })} />
                      <input className="border border-stone-200 rounded-lg px-2 py-2 text-sm" placeholder="Fat" type="number" value={form.fat} onChange={(e) => setForm({ ...form, fat: e.target.value })} />
                    </div>
                    <div className="flex gap-2 pt-1">
                      <button onClick={addEntry} disabled={isSaving} className="flex-1 bg-stone-800 text-white rounded-lg py-2 text-sm font-medium disabled:opacity-50">
                        {isSaving ? "Saving..." : "Add"}
                      </button>
                      <button onClick={() => setShowForm(false)} className="px-4 py-2 text-stone-500 text-sm">Cancel</button>
                    </div>
                  </div>
                ) : (
                  <button onClick={() => setShowForm(true)} className="w-full flex items-center justify-center gap-2 bg-white border border-dashed border-stone-300 rounded-2xl py-3 text-stone-500 text-sm font-medium">
                    <IconPlus size={16} /> Add food {selectedDate !== todayStr() ? `(${selectedDate})` : ""}
                  </button>
                )}
              </>
            )}
          </>
        )}

        {tab === "history" && (
          <div className="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
            {historyLoading ? (
              <p className="text-stone-400 text-sm text-center py-6">Loading...</p>
            ) : history.length === 0 ? (
              <p className="text-stone-400 text-sm text-center py-6">No past days logged yet</p>
            ) : (
              history.map((d) => (
                <div key={d.date} className="px-4 py-3 border-b border-stone-100 last:border-0">
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-stone-800 text-sm font-medium">{d.date}</p>
                    <p className="text-stone-400 text-xs">{d.count} items</p>
                  </div>
                  <p className="text-stone-500 text-xs">{Math.round(d.cal)} cal · {Math.round(d.protein)}g P · {Math.round(d.carbs)}g C · {Math.round(d.fat)}g F</p>
                  <div className="w-full h-1.5 bg-stone-100 rounded-full overflow-hidden mt-2">
                    <div className="h-full bg-orange-500 rounded-full" style={{ width: `${Math.min(100, (d.cal / targets.cal) * 100)}%` }} />
                  </div>
                </div>
              ))
            )}
          </div>
        )}

        {tab === "weight" && (
          <>
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-200 mb-4">
              <div className="flex items-center justify-between mb-2">
                <span className="text-stone-500 text-xs font-medium">Date</span>
                <input type="date" value={selectedWeightDate} max={todayStr()} onChange={(e) => setSelectedWeightDate(e.target.value)} className="text-sm font-medium text-stone-800 border-none bg-transparent text-right" />
              </div>
              <div className="flex gap-2">
                <input className="flex-1 border border-stone-200 rounded-lg px-3 py-2 text-sm" placeholder="Weight (kg)" type="number" step="0.1" value={weightInput} onChange={(e) => setWeightInput(e.target.value)} />
                <button onClick={addWeight} className="bg-stone-800 text-white rounded-lg px-4 py-2 text-sm font-medium">Log</button>
              </div>
              <p className="text-stone-400 text-xs mt-2">Best weighed first thing in the morning, before eating/drinking.</p>
            </div>

            {weightLoading ? (
              <p className="text-stone-400 text-sm text-center py-6">Loading...</p>
            ) : weights.length === 0 ? (
              <p className="text-stone-400 text-sm text-center py-6">No weight entries yet</p>
            ) : (
              <>
                {weights.length > 1 && (
                  <div className="bg-white rounded-2xl p-4 shadow-sm border border-stone-200 mb-4">
                    <WeightChart data={weights} />
                  </div>
                )}
                <div className="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
                  {[...weights].reverse().map((w) => (
                    <div key={w.date} className="flex items-center justify-between px-4 py-3 border-b border-stone-100 last:border-0">
                      <p className="text-stone-800 text-sm font-medium">{w.date}</p>
                      <div className="flex items-center gap-3">
                        <span className="text-stone-600 text-sm">{w.kg} kg</span>
                        <button onClick={() => removeWeight(w.date)} className="text-stone-300 hover:text-red-500 p-1">
                          <IconTrash size={15} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NutritionTracker />);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW registration failed", e));
  });
}
</script>
</body>
</html>
